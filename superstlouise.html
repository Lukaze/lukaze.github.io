<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Super St. Louise</title>
<style>
:root{--bg:#0e1a3a;--fg:#fff;--accent:#f5c518;--btn:#8e1b1b}
@media (prefers-color-scheme: dark){:root{--bg:#070d1f;--fg:#f0f0f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin-block:10px 6px;letter-spacing:.05em;color:var(--accent)}
#wrap{width:100%;max-width:960px;padding-inline:8px}
canvas{width:100%;aspect-ratio:960/560;display:block;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:none;outline:none}
#pad{display:flex;justify-content:space-between;gap:10px;margin-block:10px;user-select:none}
#pad .grp{display:flex;gap:10px}
#pad button{background:var(--btn);color:var(--fg);border:2px solid var(--accent);border-radius:14px;font-size:1.3rem;font-weight:700;min-width:72px;padding-block:14px;touch-action:none}
#pad button:active{background:var(--accent);color:#000}
#stage{position:relative}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,16,40,.9);border-radius:10px;z-index:5}
#gate.hidden{display:none}
.gbox{background:#1f3b7a;border:4px solid #f5c518;border-radius:18px;padding:22px 26px;width:min(92%,560px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#fff}
.gbox h2{margin:0 0 4px;color:#f5c518;font-size:clamp(1.3rem,3.6vw,2rem);letter-spacing:.04em}
.gbox .sub{margin:0 0 14px;opacity:.9;font-size:.95rem}
.gbox .qn{font-size:.8rem;letter-spacing:.12em;color:#4fc3f7;font-weight:700;margin-bottom:6px}
.gbox .q{font-size:clamp(1rem,2.6vw,1.3rem);font-weight:700;margin:0 0 14px}
.gbox input{width:100%;font-size:1.2rem;padding:10px 12px;border-radius:10px;border:2px solid #4fc3f7;background:#fff;color:#111;text-align:center}
.gbox button{margin-top:12px;background:#f5c518;color:#111;border:0;border-radius:12px;font-size:1.1rem;font-weight:800;padding:10px 26px;cursor:pointer}
.gbox .msg{min-height:1.4em;margin-top:10px;font-weight:700}
.gbox .msg.bad{color:#ff8a80}.gbox .msg.good{color:#a5d6a7}
.gbox .hint{font-size:.9rem;opacity:.85;margin-top:6px;min-height:1.2em}
p.help{font-size:.85rem;opacity:.8;text-align:center;margin-block:4px 16px}
</style>
</head>
<body>
<h1>SUPER ST. LOUISE</h1>
<div id="wrap">
<div id="stage">
<canvas id="game" width="960" height="560"></canvas>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
 <div class="gbox" id="gForm">
  <h2 id="gTitle">🔔 CHARGERS ONLY 🔔</h2>
  <p class="sub">Prove you're a St. Louise student to enter!</p>
  <div class="qn" id="gNum">SECRET QUESTION</div>
  <p class="q" id="gQ"></p>
  <input id="gIn" type="text" autocomplete="off" enterkeyhint="go" aria-label="Your answer" spellcheck="false" autocapitalize="off">
  <button type="button" id="gBtn">ENTER ▶</button>
  <div class="msg" id="gMsg" aria-live="polite"></div>
  <div class="hint" id="gHint"></div>
 </div>
</div>
</div>
<div id="pad">
<div class="grp"><button id="bL" aria-label="Move left">◀</button><button id="bR" aria-label="Move right">▶</button></div>
<div class="grp"><button id="bRun" aria-label="Run">RUN</button><button id="bJ" aria-label="Jump">JUMP</button></div>
</div>
<p class="help">Click the game once, then: ← → or A/D move · Space / ↑ / W jump (hold for higher) · Shift or X run · Enter start · P pause · M music</p>
</div>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=960,H=560,T=40,ROWS=14,COLS=200;
const SOLID=new Set(['#','B','?','U','C','S','K','L','D','H','W']);

// ---------- levels ----------
const LEVELS=[
 {name:'Level 1 — The Playground',short:'LV 1',theme:'out',goalX:172*T,cps:[76,115],
  intro:'LEVEL 1 — Run to the school bell tower!',
  pages:[{name:"Veteran's Day",dates:'Wed, Nov 11'},{name:'Thanksgiving Break',dates:'Nov 23 – 27'},{name:'Christmas Vacation',dates:'Dec 21 – Jan 1'},{name:'MLK Jr. Day',dates:'Mon, Jan 18'},{name:'Midwinter Break',dates:'Feb 15 – 19'},{name:'Easter Vacation',dates:'Mar 29 – Apr 2'}]},
 {name:'Level 2 — Inside St. Louise',short:'LV 2',theme:'in',goalX:181*T,cps:[34,75,114,160],
  intro:'LEVEL 2 — Inside St. Louise! Find the EXIT doors!',
  pages:[{name:'Parent-Teacher Conferences',dates:'Oct 22 – 23'},{name:'Christmas Early Dismissal',dates:'Fri, Dec 18 (noon)'},{name:'Teacher Inservice',dates:'Fri, Mar 5'},{name:'Good Friday Early Dismissal',dates:'Fri, Mar 26 (noon)'}]}
];
const TOTAL_PAGES=LEVELS.reduce((a,l)=>a+l.pages.length,0);

let lvl=0,L=LEVELS[0];
let grid,coins,enemies,items,pops,bumps,pageAt,particles,floats;
let p,cam=0,state='title',stateT=0,score=0,levelStartScore=0,apples=0,levelStartApples=0,totalApples=0,lives=3,gotPages=[[],[]],checkpoint=80,toast=null,frame=0,paused=false,winBonus=0;
let jumpBuf=0,jUp=99,jumpT=99;

function blank(){grid=[];for(let r=0;r<ROWS;r++)grid.push(new Array(COLS).fill('.'));pageAt={};coins=[];enemies=[];items=[];pops=[];bumps={};particles=[];floats=[];}
const ground=(a,b)=>{for(let c=a;c<=b;c++){grid[12][c]='#';grid[13][c]='#';}};
const row=(a,b,r,ch)=>{for(let c=a;c<=b;c++)grid[r][c]=ch;};
const col=(c,h,ch)=>{for(let i=0;i<h;i++)grid[11-i][c]=ch;};
const put=(c,r,ch)=>{grid[r][c]=ch;};
const cal=(c,r,i)=>{put(c,r,'C');pageAt[c+','+r]=i;};
const cr=(a,b,r)=>{for(let c=a;c<=b;c++)coins.push({x:c*T+T/2,y:r*T+T/2,taken:false});};
const hw=cs=>cs.forEach(c=>enemies.push({type:'hw',x:c*T,y:11*T+8,w:34,h:32,vx:-1.1,vy:0,alive:true,squash:0,flip:false}));
const quiz=cs=>cs.forEach(([c,r])=>enemies.push({type:'quiz',x:c*T,y:r*T,x0:c*T,y0:r*T,w:38,h:26,vx:-1.5,vy:0,alive:true,squash:0,flip:false,t:Math.random()*6}));
const ball=cs=>cs.forEach(c=>enemies.push({type:'ball',x:c*T,y:9*T,w:30,h:30,vx:-2.2,vy:0,alive:true,squash:0,flip:false}));

function buildL1(){
 ground(0,34);ground(38,70);ground(75,110);ground(114,COLS-1);
 put(12,8,'?');row(18,22,8,'B');put(19,8,'?');cal(21,8,1);cal(20,4,0);
 col(42,1,'K');col(43,2,'K');col(44,3,'K');col(45,4,'K');cal(47,8,2);
 col(50,2,'L');col(51,2,'L');col(58,3,'L');col(59,3,'L');put(64,8,'?');
 row(72,73,9,'B');
 row(80,95,8,'B');put(82,8,'?');put(84,8,'S');put(86,8,'?');cal(93,8,3);row(89,94,4,'B');
 cal(120,8,4);row(126,128,10,'B');row(131,133,8,'B');row(136,138,6,'B');cal(137,2,5);
 put(146,8,'?');put(148,8,'?');
 for(let i=0;i<8;i++)col(158+i,i+1,'K');
 cr(8,10,10);cr(18,22,7);cr(39,41,10);cr(50,51,9);cr(58,59,8);cr(72,73,7);cr(89,94,3);cr(100,106,10);cr(126,128,9);cr(131,133,7);cr(136,138,5);cr(151,155,10);cr(160,165,2);
 hw([25,30,54,62,92,98,104,125,140,145,150]);quiz([[85,6],[100,7],[142,6]]);
}
function buildL2(){
 ground(0,30);ground(34,70);ground(75,110);ground(114,COLS-1);row(0,COLS-1,0,'W');
 // hallway
 put(8,8,'?');cal(10,8,0);put(12,8,'?');col(15,2,'L');col(16,2,'L');col(24,3,'L');col(25,3,'L');
 // classroom
 [38,44,50,56].forEach(c=>{put(c,11,'D');put(c+1,11,'D');});
 row(40,48,8,'B');put(42,8,'?');put(44,4,'S');cal(46,8,1);
 row(62,64,10,'D');row(62,64,11,'D');
 row(72,73,9,'B');
 // library
 col(80,3,'H');col(81,3,'H');put(84,8,'?');col(87,3,'H');col(89,5,'H');row(91,97,6,'B');cal(94,2,2);col(102,2,'H');col(103,2,'H');
 // gym
 for(let i=0;i<4;i++)col(118+i,i+1,'K');
 put(128,8,'?');cal(130,8,3);put(132,8,'?');row(138,142,7,'B');
 // last hallway + stairs to the exit
 col(158,2,'L');col(159,2,'L');put(164,8,'?');
 for(let i=0;i<8;i++)col(168+i,i+1,'K');
 cr(4,7,10);cr(15,16,8);cr(24,25,7);cr(40,48,7);cr(62,64,9);cr(72,73,8);cr(80,81,8);cr(91,97,5);cr(102,103,8);cr(124,127,10);cr(138,142,6);cr(148,155,10);cr(172,175,3);
 hw([20,28,48,53,67,85,99,106,156,163]);quiz([[58,6],[96,9],[144,5]]);ball([126,135,146,152]);
}
function loadLevel(i){
 lvl=i;L=LEVELS[i];blank();(i===0?buildL1:buildL2)();
 let q=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]==='?')q++;
 totalApples=coins.length+q;
 gotPages[i]=[];checkpoint=2*T;resetPlayer(checkpoint);cam=0;
 levelStartScore=score;levelStartApples=apples;
 state='play';stateT=0;paused=false;jumpBuf=0;toast={text:L.intro,t:200};music.start();
}
function resetPlayer(x){p={x:x,y:11*T-6,w:28,h:46,vx:0,vy:0,dir:1,onGround:false,walk:0,inv:90,star:0,dead:0,sq:0,coyote:0};}
function startGame(i){score=0;apples=0;lives=3;gotPages=[[],[]];loadLevel(i||0);}
function retryLevel(){score=levelStartScore;apples=levelStartApples;lives=3;loadLevel(lvl);}
function advance(){
 if(stateT<40)return;
 if(state==='title')startGame(0);
 else if(state==='clear')loadLevel(lvl+1);
 else if(state==='over')retryLevel();
 else if(state==='win')startGame(0);
}

// ---------- sound ----------
let ac=null;
function audioInit(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}if(ac&&ac.state==='suspended')ac.resume();}
function beep(f,d,type,v,slide,delay){if(!ac)return;const t0=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);g.gain.setValueAtTime(v||0.05,t0);g.gain.exponentialRampToValueAtTime(0.0008,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.02);}
const sfx={jump:()=>beep(330,0.18,'square',0.04,660),apple:()=>{beep(988,0.07,'square',0.04);beep(1319,0.18,'square',0.04,null,0.07);},stomp:()=>beep(220,0.15,'triangle',0.08,80),bump:()=>beep(140,0.08,'triangle',0.08),page:()=>[523,659,784,1047].forEach((f,i)=>beep(f,0.14,'square',0.045,null,i*0.08)),hurt:()=>beep(400,0.5,'sawtooth',0.05,60),star:()=>[784,988,1175,1568].forEach((f,i)=>beep(f,0.1,'square',0.04,null,i*0.06)),bell:()=>{for(let i=0;i<4;i++){beep(880,1.2,'sine',0.09,null,i*0.45);beep(1320,0.9,'sine',0.04,null,i*0.45);}},
 door:()=>[392,523,659,784,1047,1319].forEach((f,i)=>beep(f,0.2,'square',0.045,null,i*0.1))};
const music=(()=>{const A=[523,0,659,784,659,0,523,587,659,0,587,523,440,0,523,0,587,0,698,880,698,0,587,659,698,0,659,587,523,0,0,0];
 const B=[392,440,494,0,587,0,494,440,392,0,330,392,440,0,0,0,392,440,494,0,659,0,587,494,523,0,494,440,392,0,0,0];
 let i=0,timer=null,on=true;return{start(){this.stop();i=0;timer=setInterval(()=>{if(!on||state!=='play'||paused)return;const mel=lvl===0?A:B;const f=mel[i%mel.length];if(f)beep(f,0.16,'triangle',0.025);if(i%4===0)beep(lvl===0?131:98,0.2,'triangle',0.03);i++;},lvl===0?170:150);},stop(){if(timer)clearInterval(timer);timer=null;},toggle(){on=!on;}};})();

// ---------- input ----------
const gate=document.getElementById('gate');let gateOpen=true;
const QUIZ=[
 {q:'St. Louise students are the ________!',a:['charger','chargers','the chargers','st louise chargers'],hint:'It’s our team name. It starts with “C” and it’s on the Friday gear.'},
 {q:'What color is the school sweater you wear on Mass days?',a:['red','red sweater','a red sweater'],hint:'Same color as a stop sign.'},
 {q:'What’s the before- and after-school program called?',a:['kids club','kidsclub','kids','the kids club'],hint:'It’s ______ Club.'},
 {q:'On what day of the week can you wear Charger Gear instead of the sweater?',a:['friday','fridays','fri'],hint:'The last school day of the week!'}
];
function norm(t){return String(t).toLowerCase().replace(/[’'`.!?,]/g,'').replace(/\s+/g,' ').trim();}
function startGate(){
 let passed=false;try{passed=sessionStorage.getItem('slGate')==='ok';}catch(e){}
 if(passed){gate.classList.add('hidden');gateOpen=false;return;}
 const pool=QUIZ.slice(),picks=[];while(picks.length<1)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
 let qi=0,tries=0;const qEl=document.getElementById('gQ'),nEl=document.getElementById('gNum'),inEl=document.getElementById('gIn'),mEl=document.getElementById('gMsg'),hEl=document.getElementById('gHint');
 const show=()=>{qEl.textContent=picks[qi].q;inEl.value='';hEl.textContent='';tries=0;setTimeout(()=>{try{inEl.focus();}catch(e){}},30);};
 let busy=false;const check=()=>{if(busy)return;audioInit();
  const v=norm(inEl.value);if(!v)return;const cur=picks[qi];
  if(cur.a.some(x=>norm(x)===v)){
   sfx.apple();mEl.className='msg good';mEl.textContent='Welcome, Charger! 🎉';qi++;
   if(qi<1){busy=true;setTimeout(()=>{busy=false;mEl.textContent='';show();},700);}
   else{busy=true;try{sessionStorage.setItem('slGate','ok');}catch(e){}setTimeout(()=>{gate.classList.add('hidden');gateOpen=false;grabFocus();},900);}
  }else{
   tries++;sfx.hurt();mEl.className='msg bad';mEl.textContent=tries>=2?'Not quite — here’s a hint!':'Not quite — try again!';
   if(tries>=2)hEl.textContent='Hint: '+cur.hint;try{inEl.select();}catch(e){}
  }};
 inEl.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.code==='Enter'||ev.code==='NumpadEnter'||ev.keyCode===13){ev.preventDefault();ev.stopPropagation();check();}});
 document.getElementById('gBtn').addEventListener('click',ev=>{ev.preventDefault();check();});
 show();
}
const keys={};let jumpPressed=false;
const cmap={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'J',KeyW:'J',Space:'J',KeyZ:'J',KeyK:'J',ShiftLeft:'Run',ShiftRight:'Run',KeyX:'Run',KeyJ:'Run'};
const kmap={ArrowLeft:'L',Left:'L',a:'L',A:'L',ArrowRight:'R',Right:'R',d:'R',D:'R',ArrowUp:'J',Up:'J',w:'J',W:'J',' ':'J',Spacebar:'J',z:'J',Z:'J',Shift:'Run',x:'Run',X:'Run'};
function keyAction(e){return cmap[e.code]||kmap[e.key];}
function onKeyDown(e){if(gateOpen)return;audioInit();const k=keyAction(e);
 if(k){if(k==='J'&&!keys.J&&!e.repeat)jumpPressed=true;keys[k]=true;e.preventDefault();}
 if(state!=='play'){
  if(state==='title'&&(e.code==='Digit2'||e.key==='2')&&stateT>=40){startGame(1);return;}
  if(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter'||(k==='J'&&!e.repeat)){e.preventDefault();advance();}
 }
 if((e.code==='KeyP'||e.key==='p'||e.key==='P')&&state==='play')paused=!paused;
 if(e.code==='KeyM'||e.key==='m'||e.key==='M')music.toggle();}
function onKeyUp(e){if(gateOpen)return;const k=keyAction(e);if(k){keys[k]=false;e.preventDefault();}}
document.addEventListener('keydown',onKeyDown,true);
document.addEventListener('keyup',onKeyUp,true);
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.tabIndex=0;
function grabFocus(){if(gateOpen)return;try{window.focus();}catch(e){}try{cv.focus({preventScroll:true});}catch(e){}}
window.addEventListener('load',grabFocus);grabFocus();
document.addEventListener('pointerdown',grabFocus);
function bindBtn(id,k){const b=document.getElementById(id);
 const down=e=>{e.preventDefault();if(gateOpen)return;audioInit();grabFocus();if(state!=='play'){advance();return;}if(k==='J'&&!keys.J)jumpPressed=true;keys[k]=true;};
 const up=e=>{e.preventDefault();keys[k]=false;};
 b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);}
bindBtn('bL','L');bindBtn('bR','R');bindBtn('bJ','J');bindBtn('bRun','Run');
cv.addEventListener('pointerdown',()=>{if(gateOpen)return;audioInit();grabFocus();if(state!=='play')advance();});

// ---------- physics ----------
function tileAt(c,r){if(c<0||c>=COLS)return'#';if(r<0||r>=ROWS)return'.';return grid[r][c];}
function solidAt(c,r){return SOLID.has(tileAt(c,r));}
function moveBody(b,onHead){let hitX=false;b.x+=b.vx;
 const r0=Math.floor(b.y/T),r1=Math.floor((b.y+b.h-1)/T);
 if(b.vx>0){const c=Math.floor((b.x+b.w-1)/T);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=c*T-b.w;hitX=true;break;}}
 else if(b.vx<0){const c=Math.floor(b.x/T);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){b.x=(c+1)*T;hitX=true;break;}}
 b.y+=b.vy;b.onGround=false;const c0=Math.floor(b.x/T),c1=Math.floor((b.x+b.w-1)/T);
 if(b.vy>0){const r=Math.floor((b.y+b.h-1)/T);for(let c=c0;c<=c1;c++)if(solidAt(c,r)){b.y=r*T-b.h;b.vy=0;b.onGround=true;break;}}
 else if(b.vy<0){const r=Math.floor(b.y/T);let best=-1,bd=1e9;const mid=b.x+b.w/2;for(let c=c0;c<=c1;c++)if(solidAt(c,r)){const d=Math.abs(c*T+T/2-mid);if(d<bd){bd=d;best=c;}}if(best>=0){b.y=(r+1)*T;b.vy=0;if(onHead)onHead(best,r);}}
 return hitX;}
function burst(x,y,cols,n){for(let i=0;i<(n||16);i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*7-1,t:40,c:cols[i%cols.length]});}
function floatText(x,y,s,c){floats.push({x,y,s,c:c||'#fff',t:50});}
function kill(e,flip){if(flip){e.flip=true;e.vy=-7;e.vx=0;e.alive=false;}else{e.squash=30;e.alive=false;}score+=100;floatText(e.x+e.w/2,e.y-6,'+100');sfx.stomp();}
function bumpBlock(c,r){const ch=grid[r][c];bumps[c+','+r]=10;
 enemies.forEach(e=>{if(e.alive&&e.type!=='quiz'&&Math.abs(e.y+e.h-r*T)<4&&e.x+e.w>c*T&&e.x<c*T+T)kill(e,true);});
 if(ch==='?'){grid[r][c]='U';apples++;score+=200;sfx.apple();pops.push({x:c*T+T/2,y:r*T-14,vy:-10});}
 else if(ch==='C'){grid[r][c]='U';const idx=pageAt[c+','+r];if(!gotPages[lvl].includes(idx))gotPages[lvl].push(idx);score+=1000;sfx.page();
  items.push({type:'page',x:c*T+6,y:r*T-34,vy:-2,t:70});const pg=L.pages[idx];toast={text:'NO SCHOOL!  '+pg.name+' · '+pg.dates,t:220};burst(c*T+T/2,r*T,['#4fc3f7','#fff','#f5c518']);}
 else if(ch==='S'){grid[r][c]='U';sfx.bump();items.push({type:'star',x:c*T+6,y:r*T-30,w:28,h:28,vx:2.2,vy:-6,onGround:false});}
 else sfx.bump();}
function hurt(){if(p.inv>0||p.star>0||p.dead)return;p.dead=1;p.vy=-11;p.vx=0;sfx.hurt();}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(){frame++;stateT++;
 if(toast&&--toast.t<=0)toast=null;
 particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=0.35;q.t--;});particles=particles.filter(q=>q.t>0);
 floats.forEach(f=>{f.y-=1.2;f.t--;});floats=floats.filter(f=>f.t>0);
 if(state!=='play'||paused)return;

 ctx.fillStyle='#1f2f5c';ctx.fillRect(-9,34,8,9+(air?-2:s*0.4));ctx.fillRect(1,34,8,9+(air?2:-s*0.4));
 ctx.fillStyle='#111';ctx.fillRect(-10+(air?-2:-s*0.5),42+(air?-2:0),10,4);ctx.fillRect(air?3:s*0.5,42,11,4);
 rr(-10,19,20,17,4,sweater);
 ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(-10,32,20,4);
 ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-6,19);ctx.lineTo(0,24);ctx.lineTo(-1,27);ctx.lineTo(-7,21);ctx.fill();ctx.beginPath();ctx.moveTo(6,19);ctx.lineTo(0,24);ctx.lineTo(1,27);ctx.lineTo(7,21);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 6px sans-serif';ctx.textAlign='center';ctx.fillText('SL',5,31);
 ctx.fillStyle=sweater;ctx.fillRect(8,21+(air?-6:0),5,9);ctx.fillRect(-12,21+(air?-3:s*0.25),4,9);
 ctx.fillStyle='#f1c27d';ctx.fillRect(8,29+(air?-6:0),5,3);ctx.fillRect(-12,29+(air?-3:s*0.25),4,3);
 ctx.beginPath();ctx.arc(0,11,10,0,7);ctx.fill();
 ctx.fillStyle='#5b3a1e';ctx.beginPath();ctx.arc(0,8,10.5,Math.PI*1.02,Math.PI*1.98);ctx.fill();ctx.fillRect(-10,3,5,10);ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(9,1);ctx.lineTo(6,6);ctx.lineTo(-2,5);ctx.fill();
 ctx.fillStyle='#000';ctx.fillRect(4,9,3,4);if(dead)ctx.fillRect(1,15,6,2);else{ctx.fillStyle='#b5523b';ctx.fillRect(3,15,5,2);}
 ctx.restore();}
function drawPlayer(){if(p.inv>0&&!p.dead&&Math.floor(p.inv/4)%2)return;
 const moving=p.onGround&&Math.abs(p.vx)>0.3;
 drawStudent(p.x-cam+p.w/2,p.y+p.h,p.dir,{s:moving?Math.sin(p.walk*2.2)*5:0,air:!p.onGround&&!p.dead,sq:p.sq,star:p.star,dead:p.dead});}

function sign(x,y,w,label){if(x<-w-20||x>W+20)return;ctx.fillStyle='#5b3a1e';ctx.fillRect(x+w/2-4,y+40,8,480-y-40);rr(x,y,w,42,8,'#8e1b1b');ctx.strokeStyle='#f5c518';ctx.lineWidth=3;ctx.strokeRect(x+4,y+4,w-8,34);txt(label,x+w/2,y+27,'bold 15px Trebuchet MS, sans-serif','#fff');}

function drawDecorOut(){
 const sx=3*T-cam;if(sx>-300&&sx<W){ctx.fillStyle='#5b3a1e';ctx.fillRect(sx+60,380,8,100);rr(sx,330,190,60,8,'#8e1b1b');ctx.strokeStyle='#f5c518';ctx.lineWidth=3;ctx.strokeRect(sx+4,334,182,52);txt('ST. LOUISE SCHOOL',sx+95,356,'bold 15px Trebuchet MS, sans-serif','#fff');txt('Bellevue · this way →',sx+95,375,'12px Trebuchet MS, sans-serif','#fff');}
 const bx=L.goalX-cam;
 if(bx>-800&&bx<W+100){const s2=bx+140;ctx.fillStyle='#c96b4a';ctx.fillRect(s2,260,560,220);ctx.fillStyle='#7e3424';ctx.beginPath();ctx.moveTo(s2-20,262);ctx.lineTo(s2+280,190);ctx.lineTo(s2+580,262);ctx.fill();
  ctx.fillStyle='#fff3c4';for(let i=0;i<6;i++){ctx.fillRect(s2+30+i*88,300,50,46);ctx.fillRect(s2+30+i*88,380,50,46);}
  rr(s2+230,220,100,34,6,'#8e1b1b');txt('ST. LOUISE',s2+280,242,'bold 13px Trebuchet MS, sans-serif','#f5c518');ctx.fillStyle='#5b3a1e';ctx.fillRect(s2+255,410,50,70);
  ctx.fillStyle='#d9c6a5';ctx.fillRect(bx,170,80,310);ctx.fillStyle='#bfa983';for(let y=180;y<480;y+=20)ctx.fillRect(bx,y,80,2);
  ctx.fillStyle='#7e3424';ctx.beginPath();ctx.moveTo(bx-10,172);ctx.lineTo(bx+40,100);ctx.lineTo(bx+90,172);ctx.fill();
  ctx.fillStyle='#f5c518';ctx.fillRect(bx+37,62,6,40);ctx.fillRect(bx+27,74,26,6);
  rr(bx+14,186,52,70,22,'#3a2a1a');const sw=state==='clear'?Math.sin(frame/5)*0.5:Math.sin(frame/40)*0.08;
  ctx.save();ctx.translate(bx+40,196);ctx.rotate(sw);ctx.fillStyle='#f5c518';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.quadraticCurveTo(12,10,18,34);ctx.lineTo(-18,34);ctx.quadraticCurveTo(-12,10,-6,0);ctx.fill();ctx.fillStyle='#b8860b';ctx.beginPath();ctx.arc(0,38,5,0,7);ctx.fill();ctx.restore();
  rr(bx+22,410,36,70,14,'#5b3a1e');}}

function drawDecorIn(){
 sign(2*T-cam,300,150,'HALLWAY');
 sign(35*T-cam,300,150,'ROOM 6');
 sign(76*T-cam,300,150,'LIBRARY');
 sign(115*T-cam,240,130,'GYM');
 let x=50*T-cam;if(x>-420&&x<W){ctx.fillStyle='#8d6e3f';ctx.fillRect(x-8,92,376,186);ctx.fillStyle='#2e4a3a';ctx.fillRect(x,100,360,170);
  txt('Welcome to Room 6!',x+180,140,'bold 22px Trebuchet MS, sans-serif','#f0f0f0');txt('Spelling test Friday',x+180,178,'18px Trebuchet MS, sans-serif','#f0f0f0');txt('2 + 2 = 4   ✓',x+180,212,'18px Trebuchet MS, sans-serif','#fff59d');txt('Go Chargers!',x+180,248,'italic 16px Trebuchet MS, sans-serif','#ef9a9a');}
 x=134*T-cam;if(x>-300&&x<W+100){ctx.fillStyle='#fff';ctx.fillRect(x,110,120,80);ctx.strokeStyle='#d32f2f';ctx.lineWidth=4;ctx.strokeRect(x,110,120,80);ctx.strokeRect(x+38,140,44,34);ctx.fillStyle='#ff7043';ctx.fillRect(x+30,186,60,5);
  ctx.strokeStyle='#eee';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(x+32+i*11,191);ctx.lineTo(x+38+i*8,226);ctx.stroke();}}
 x=145*T-cam;if(x>-500&&x<W){rr(x,80,420,60,10,'#8e1b1b');txt('ST. LOUISE CHARGERS',x+210,120,'bold 28px Trebuchet MS, sans-serif','#f5c518');}
 const dx=L.goalX-cam;if(dx>-300&&dx<W+100){
  ctx.fillStyle='#5d4037';ctx.fillRect(dx-10,250,180,230);
  const open=state==='win'?Math.min(1,stateT/30):0;
  const g=ctx.createLinearGradient(0,260,0,480);g.addColorStop(0,'#7cc8ff');g.addColorStop(1,'#a5e28d');ctx.fillStyle=g;ctx.fillRect(dx,260,160,220);
  ctx.fillStyle='#fff8e1';ctx.beginPath();ctx.arc(dx+120,300,18,0,7);ctx.fill();
  ctx.fillStyle='#8e1b1b';ctx.fillRect(dx,260,80*(1-open),220);ctx.fillRect(dx+80+80*open,260,80*(1-open),220);
  if(open<1){ctx.fillStyle='#bfe3ff';ctx.fillRect(dx+16,280,48*(1-open),70);ctx.fillRect(dx+96+80*open,280,48*(1-open),70);}
  rr(dx+30,210,100,34,6,'#2e7d32');txt('EXIT',dx+80,234,'bold 22px Trebuchet MS, sans-serif','#fff');
  txt('SUMMER →',dx+80,200,'bold 14px Trebuchet MS, sans-serif','#8e1b1b');}
}

function drawWorld(){
 const c0=Math.max(0,Math.floor(cam/T)),c1=Math.min(COLS-1,Math.floor((cam+W)/T)+1);
 if(L.theme==='out')drawDecorOut();else drawDecorIn();
 for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++){const ch=grid[r][c];if(ch==='.')continue;const b=bumps[c+','+r];drawTile(ch,c*T-cam,r*T+(b?-Math.sin((10-b)/10*Math.PI)*10:0),c,r);}
 coins.forEach(k=>{if(!k.taken&&k.x>cam-40&&k.x<cam+W+40)drawApple(k.x-cam,k.y+Math.sin(frame/12+k.x)*3,1);});
 pops.forEach(q=>drawApple(q.x-cam,q.y,1.1));
 items.forEach(it=>{if(it.type==='page')drawPage(it.x-cam,it.y);else drawStar(it.x-cam+14,it.y+14,15,frame);});
 enemies.forEach(e=>{if(e.x>cam-60&&e.x<cam+W+60)drawEnemy(e,e.x-cam);});
 drawPlayer();
 particles.forEach(q=>{ctx.fillStyle=q.c;ctx.fillRect(q.x-cam,q.y,5,5);});
 floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t/20);txt(f.s,f.x-cam,f.y,'bold 16px Trebuchet MS, sans-serif',f.c);ctx.globalAlpha=1;});}

function overlayPanel(h){ctx.fillStyle='rgba(8,16,40,.78)';ctx.fillRect(0,0,W,H);rr(W/2-340,H/2-h/2,680,h,18,'#1f3b7a');ctx.strokeStyle='#f5c518';ctx.lineWidth=4;ctx.strokeRect(W/2-332,H/2-h/2+8,664,h-16);}
function drawHUD(){ctx.fillStyle='rgba(14,26,58,.72)';ctx.fillRect(0,0,W,40);
 const f='bold 18px Trebuchet MS, sans-serif';
 txt(L.short,14,27,f,'#f5c518','left');
 txt('SCORE '+String(score).padStart(6,'0'),70,27,f,'#fff','left');
 drawApple(262,18,0.8);txt('× '+apples,278,27,f,'#fff','left');
 txt('DAYS OFF '+gotPages[lvl].length+'/'+L.pages.length,350,27,f,'#4fc3f7','left');
 txt('♥'.repeat(Math.max(0,Math.min(lives,8))),520,27,f,'#ff6b6b','left');
 txt(lvl===0?'Ring the bell →':'Find the EXIT →',W-14,26,'13px Trebuchet MS, sans-serif','#ccc','right');
 if(p.star>0){ctx.fillStyle='#f5c518';ctx.fillRect(14,44,p.star/600*200,6);}
 if(toast){ctx.font='bold 20px Trebuchet MS, sans-serif';const w=ctx.measureText(toast.text).width+40;rr(W/2-w/2,64,w,40,10,'rgba(47,128,237,.92)');txt(toast.text,W/2,91,'bold 20px Trebuchet MS, sans-serif','#fff');}
 if(paused){overlayPanel(140);txt('PAUSED',W/2,H/2-6,'bold 34px Trebuchet MS, sans-serif','#f5c518');txt('Press P to keep playing',W/2,H/2+30,'18px Trebuchet MS, sans-serif','#fff');}}
function blink(){return Math.floor(frame/30)%2===0;}
function drawTitle(){overlayPanel(450);
 txt('SUPER ST. LOUISE',W/2,118,'bold 50px Trebuchet MS, sans-serif','#f5c518');
 txt('A Bellevue school adventure · 2 levels',W/2,148,'italic 18px Trebuchet MS, sans-serif','#fff');
 ['Level 1: Run across the playground and ring the bell tower.','Level 2: Race through the halls, Room 6, the library and the gym!','Bonk blue OFF blocks to find all '+TOTAL_PAGES+' real No-School days.','Stomp Homework Piles & Dodgeballs. Dodge flying Pop Quizzes.','Apples for the teacher: 25 = extra life. Find the Recess Star!'].forEach((t,i)=>txt(t,W/2,192+i*29,'17px Trebuchet MS, sans-serif','#fff'));
 drawStudent(260,400,1,{s:Math.sin(frame/6)*5});drawApple(320,385,1.1);drawStar(370,385,15,frame);drawPage(405,370);
 drawEnemy({type:'hw',x:0,y:368,w:34,h:32,vx:-1},460);drawEnemy({type:'ball',x:0,y:370,w:30,h:30,vx:-1},520);drawEnemy({type:'quiz',x:0,y:372,w:38,h:26},575);
 if(blink())txt('Press ENTER / SPACE or click to start',W/2,450,'bold 22px Trebuchet MS, sans-serif','#4fc3f7');
 txt('(press 2 to skip straight to Level 2)',W/2,476,'14px Trebuchet MS, sans-serif','#cfd8dc');}
function drawClear(){overlayPanel(380);const top=H/2-190;
 txt('DING DONG! The bell is ringing!',W/2,top+60,'bold 34px Trebuchet MS, sans-serif','#f5c518');
 txt('Class is starting — get inside St. Louise!',W/2,top+92,'19px Trebuchet MS, sans-serif','#fff');
 txt('Score '+score+'   ·   Bell bonus '+winBonus+'   ·   Lives '+lives,W/2,top+126,'18px Trebuchet MS, sans-serif','#fff');
 txt('Days off found in Level 1 ('+gotPages[0].length+'/6):',W/2,top+160,'bold 17px Trebuchet MS, sans-serif','#4fc3f7');
 LEVELS[0].pages.forEach((pg,i)=>{const got=gotPages[0].includes(i);txt((got?'✔ ':'✗ ')+pg.name+' — '+(got?pg.dates:'???'),W/2,top+186+i*22,'16px Trebuchet MS, sans-serif',got?'#a5d6a7':'rgba(255,255,255,.45)');});
 if(blink()&&stateT>40)txt('Press ENTER / SPACE or tap for LEVEL 2',W/2,top+340,'bold 20px Trebuchet MS, sans-serif','#f5c518');}
function drawOver(){overlayPanel(260);
 txt('DETENTION!',W/2,H/2-50,'bold 44px Trebuchet MS, sans-serif','#ff6b6b');
 txt('The homework got you. Score: '+score,W/2,H/2,'20px Trebuchet MS, sans-serif','#fff');
 if(stateT>40)txt('Press ENTER / SPACE or tap to retry '+L.short,W/2,H/2+50,'20px Trebuchet MS, sans-serif','#4fc3f7');}
function drawWin(){overlayPanel(530);const top=H/2-265;
 txt("SCHOOL'S OUT! YOU BEAT SUPER ST. LOUISE!",W/2,top+52,'bold 28px Trebuchet MS, sans-serif','#f5c518');
 txt('Final score '+score+'   ·   Apples '+apples+'   ·   Exit bonus '+winBonus,W/2,top+84,'18px Trebuchet MS, sans-serif','#fff');
 const n=gotPages[0].length+gotPages[1].length;
 txt('No-School Days you found ('+n+'/'+TOTAL_PAGES+'):',W/2,top+118,'bold 17px Trebuchet MS, sans-serif','#4fc3f7');
 let i=0;LEVELS.forEach((lv,li)=>lv.pages.forEach((pg,pi)=>{const got=gotPages[li].includes(pi);txt((got?'✔ ':'✗ ')+pg.name+' — '+(got?pg.dates:'???'),W/2,top+146+i*26,'16px Trebuchet MS, sans-serif',got?'#a5d6a7':'rgba(255,255,255,.45)');i++;}));
 txt(n===TOTAL_PAGES?'PERFECT! You found every single day off!':'Play again to find the missing days!',W/2,top+418,'bold 18px Trebuchet MS, sans-serif',n===TOTAL_PAGES?'#f5c518':'#fff');
 if(stateT>40&&blink())txt('Press ENTER / SPACE or tap to play again',W/2,top+454,'bold 18px Trebuchet MS, sans-serif','#4fc3f7');
 drawStudent(W/2-250,top+500,1,{air:true});drawStudent(W/2+250,top+500,-1,{air:true});}
function render(){if(L.theme==='out')drawBgOut();else drawBgIn();drawWorld();
 if(state!=='title')drawHUD();
 if(state==='title')drawTitle();else if(state==='clear')drawClear();else if(state==='over')drawOver();else if(state==='win')drawWin();}

blank();buildL1();resetPlayer(2*T);stateT=40;startGate();
let last=performance.now(),accum=0;
function loop(now){accum+=Math.min(100,now-last);last=now;while(accum>=1000/60){update();accum-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
