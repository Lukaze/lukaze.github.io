<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Super St. Louise</title>
<style>
:root{--bg:#0e1a3a;--fg:#fff;--accent:#f5c518;--btn:#8e1b1b}
@media (prefers-color-scheme: dark){:root{--bg:#070d1f;--fg:#f0f0f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin-block:10px 6px;letter-spacing:.05em;color:var(--accent)}
#wrap{width:100%;max-width:960px;padding-inline:8px}
canvas{width:100%;aspect-ratio:960/560;display:block;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:none;outline:none}
#pad{display:flex;justify-content:space-between;gap:10px;margin-block:10px;user-select:none}
#pad .grp{display:flex;gap:10px}
#pad button{background:var(--btn);color:var(--fg);border:2px solid var(--accent);border-radius:14px;font-size:1.3rem;font-weight:700;min-width:72px;padding-block:14px;touch-action:none}
#pad button:active{background:var(--accent);color:#000}
#stage{position:relative}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,16,40,.9);border-radius:10px;z-index:5}
#gate.hidden{display:none}
.gbox{background:#1f3b7a;border:4px solid #f5c518;border-radius:18px;padding:22px 26px;width:min(92%,560px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);color:#fff}
.gbox h2{margin:0 0 4px;color:#f5c518;font-size:clamp(1.3rem,3.6vw,2rem);letter-spacing:.04em}
.gbox .sub{margin:0 0 14px;opacity:.9;font-size:.95rem}
.gbox .qn{font-size:.8rem;letter-spacing:.12em;color:#4fc3f7;font-weight:700;margin-bottom:6px}
.gbox .q{font-size:clamp(1rem,2.6vw,1.3rem);font-weight:700;margin:0 0 14px}
.gbox input{width:100%;font-size:1.2rem;padding:10px 12px;border-radius:10px;border:2px solid #4fc3f7;background:#fff;color:#111;text-align:center}
.gbox button{margin-top:12px;background:#f5c518;color:#111;border:0;border-radius:12px;font-size:1.1rem;font-weight:800;padding:10px 26px;cursor:pointer}
.gbox .msg{min-height:1.4em;margin-top:10px;font-weight:700}
.gbox .msg.bad{color:#ff8a80}.gbox .msg.good{color:#a5d6a7}
.gbox .hint{font-size:.9rem;opacity:.85;margin-top:6px;min-height:1.2em}
p.help{font-size:.85rem;opacity:.8;text-align:center;margin-block:4px 16px}
</style>
</head>

  <button type="button" id="gBtn">ENTER ▶</button>
  <div class="msg" id="gMsg" aria-live="polite"></div>
  <div class="hint" id="gHint"></div>
 </div>
</div>
</div>
<div id="pad">

   txt(lv.title,cx+cw/2,cy+118+bob,'bold 14px Trebuchet MS, sans-serif','#fff');
   txt(story.done[i]?'✔ complete':(lv.pages.length?('days off '+(story.pg[i]||[]).length+'/'+lv.pages.length):(lv.boss?'BOSS':TEACH[lv.teacher].name)),cx+cw/2,cy+138+bob,'13px Trebuchet MS, sans-serif','#cfd8dc');}
  else txt('🔒 Locked',cx+cw/2,cy+90+bob,'bold 16px Trebuchet MS, sans-serif','rgba(255,255,255,.55)');
  btns.push({x:cx,y:cy,w:cw,h:chh,act:()=>{smSel=i;trySOpen(i);}});});
 if(lockFlash>0)txt('🔒 Finish the chapter before it to unlock!',W/2,o.y+440,'bold 18px Trebuchet MS, sans-serif','#ff8a80');
 else txt('← ↑ ↓ → choose · ENTER / SPACE to play · ESC back',W/2,o.y+440,'15px Trebuchet MS, sans-serif','#cfd8dc');
 button(o.x+24,o.y+454,130,34,'◀ BACK',false,()=>goTitle(),'#5c6b8a',15);}
function wrapLeft(str,x,y,maxW,lh,font,color){ctx.font=font;const words=str.split(' ');let line='',n=0;
 words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){txt(line,x,y+n*lh,font,color,'left');n++;line=w;}else line=t;});txt(line,x,y+n*lh,font,color,'left');}
function drawScene(){if(!scene)return;const ln=scene.lines[scene.i],spk=ln[0],full=ln[1],shown=full.slice(0,Math.floor(scene.ch)),typing=scene.ch<full.length;
 ctx.fillStyle='rgba(8,16,40,.35)';ctx.fillRect(0,0,W,H);
 if(scene.title){ctx.font='bold 22px Trebuchet MS, sans-serif';const tw=ctx.measureText(scene.title).width+40;rr(W/2-tw/2,52,tw,42,10,'rgba(142,27,27,.95)');txt(scene.title,W/2,80,'bold 22px Trebuchet MS, sans-serif','#f5c518');}
 const bx=20,by=H-176,bw=W-40,bh=156;
 rr(bx+14,by-86,160,236,16,'#2b4a8f');ctx.strokeStyle='#f5c518';ctx.lineWidth=3;ctx.strokeRect(bx+18,by-82,152,228);
 ctx.save();ctx.beginPath();ctx.rect(bx+20,by-80,148,224);ctx.clip();
 if(spk==='kid'){ctx.save();ctx.translate(bx+94,by+136);ctx.scale(2.5,2.5);drawStudent(0,0,1,{s:typing?Math.sin(frame/4)*2:0});ctx.restore();}
 else if(spk==='monster')drawMonster(bx+94,by+140,1.25,{look:1});
 else drawAdult(bx+94,by+144,1,TEACH[spk],2.6,{talk:typing});
 ctx.restore();
 rr(bx+180,by,bw-180,bh,16,'rgba(20,32,70,.96)');ctx.strokeStyle='#f5c518';ctx.lineWidth=4;ctx.strokeRect(bx+186,by+6,bw-192,bh-12);
 const nm=spk==='kid'?'You':spk==='monster'?'Homework Monster':TEACH[spk].name+' · '+TEACH[spk].role;
 ctx.font='bold 18px Trebuchet MS, sans-serif';const nw=ctx.measureText(nm).width+28;rr(bx+200,by-18,nw,34,8,spk==='monster'?'#6a1b9a':spk==='kid'?'#c62828':'#1f3b7a');txt(nm,bx+214,by+5,'bold 18px Trebuchet MS, sans-serif','#fff','left');
 wrapLeft(shown,bx+210,by+52,bw-250,30,'bold 21px Trebuchet MS, sans-serif','#fff');
 if(!typing&&blink())txt('▼ ENTER',bx+bw-24,by+bh-18,'bold 15px Trebuchet MS, sans-serif','#f5c518','right');
 txt((scene.i+1)+'/'+scene.lines.length,bx+206,by+bh-18,'13px Trebuchet MS, sans-serif','#90a4ae','left');
 button(W-136,14,122,34,'SKIP ▶▶',false,()=>sceneSkip(),'#5c6b8a',14);}
function drawIntro(){const d=chal.def,o=bigPanel(700,430);
 txt('CHALLENGE '+(chal.i+1)+' of '+CH.length,W/2,o.y+48,'bold 16px Trebuchet MS, sans-serif','#4fc3f7');
 txt(d.name.toUpperCase(),W/2,o.y+90,'bold 38px Trebuchet MS, sans-serif','#f5c518');
 const nl=wrapTxt(d.desc,W/2,o.y+122,600,22,'17px Trebuchet MS, sans-serif','#fff');const dy=(nl-1)*22;
 o.y+=dy/2;rr(W/2-300,o.y+144,600,42,10,'rgba(255,255,255,.12)');
 txt('GOAL: '+d.goalText+(d.limit&&d.goal!=='survive'?'  ('+d.limit+'s)':'')+(d.lives===1?'  · 1 life!':''),W/2,o.y+172,'bold 18px Trebuchet MS, sans-serif','#a5d6a7');
 starRules(d).forEach((t,k)=>txt(t,W/2,o.y+222+k*28,'17px Trebuchet MS, sans-serif',k===0?'#f5c518':'#fff'));
 txt('Your best:',W/2-40,o.y+316,'16px Trebuchet MS, sans-serif','#cfd8dc');starRow(best[chal.i]||0,W/2+45,o.y+318,22);
 button(W/2-170,o.y+340,190,48,'▶ START',true,()=>beginChal(),'#2e7d32');
 button(W/2+40,o.y+340,130,48,'☰ MENU',false,()=>openMenu(),'#5c6b8a');}
function drawCWin(){const c=chal,d=c.def,o=bigPanel(620,420);
 txt('CHALLENGE COMPLETE!',W/2,o.y+60,'bold 36px Trebuchet MS, sans-serif','#f5c518');
 txt(d.name,W/2,o.y+92,'bold 20px Trebuchet MS, sans-serif','#fff');
 const shown=Math.min(c.stars,Math.max(0,Math.floor((stateT-25)/22)+1));starRow(shown,W/2,o.y+170,64);
 const info=d.rate==='hits'?('Hits taken: '+c.hits):d.rate==='apples'?('Apples: '+apples+' / '+c.total+'   ·   Time '+fmtT(c.t/60)):('Your time: '+fmtT(c.t/60));
 txt(info,W/2,o.y+214,'19px Trebuchet MS, sans-serif','#fff');
 if(c.newBest&&stateT>90)txt('★ NEW BEST! ★',W/2,o.y+246,'bold 20px Trebuchet MS, sans-serif','#a5d6a7');
 else if(c.newTime&&stateT>90)txt('New best time!',W/2,o.y+246,'bold 18px Trebuchet MS, sans-serif','#a5d6a7');
 if(c.stars<3&&stateT>90)txt('Tip: '+(d.rate==='hits'?'take no hits':d.rate==='apples'?'grab 80% of the apples':'finish in '+d.s3+' seconds')+' for 3 stars!',W/2,o.y+276,'15px Trebuchet MS, sans-serif','#cfd8dc');
 const n=c.i+1,hasNext=n<CH.length&&unlocked(n);
 button(W/2-260,o.y+320,170,48,hasNext?'NEXT ▶':'☰ MENU',true,()=>{if(hasNext){menuSel=n;loadChal(n);}else openMenu();},'#2e7d32');
 button(W/2-75,o.y+320,150,48,'↻ RETRY',false,()=>retryChal(c.i),'#2f80ed');
 button(W/2+90,o.y+320,170,48,'☰ MENU',false,()=>openMenu(),'#5c6b8a');
 txt('ENTER = '+(hasNext?'next':'menu')+' · R = retry · ESC = menu',W/2,o.y+394,'14px Trebuchet MS, sans-serif','#cfd8dc');}
function drawCFail(){const c=chal,d=c.def,o=bigPanel(560,320);
 txt('SO CLOSE!',W/2,o.y+64,'bold 42px Trebuchet MS, sans-serif','#ff8a80');
 txt(c.why||'Try again!',W/2,o.y+104,'bold 20px Trebuchet MS, sans-serif','#fff');
 const prog=d.goal==='apples'?('You got '+apples+' of '+d.target+' apples'):d.goal==='stomp'?('You stomped '+c.kills+' of '+d.target):d.goal==='pages'?('You found '+gotPages[99].length+' of '+d.target+' days off'):d.goal==='survive'?('You lasted '+fmtT(c.t/60)):'Keep practicing — you can do it!';
 txt(prog,W/2,o.y+140,'18px Trebuchet MS, sans-serif','#cfd8dc');
 button(W/2-200,o.y+190,220,52,'↻ TRY AGAIN',true,()=>retryChal(c.i),'#2e7d32');
 button(W/2+40,o.y+190,160,52,'☰ MENU',false,()=>openMenu(),'#5c6b8a');
 txt('ENTER = try again · ESC = menu',W/2,o.y+276,'14px Trebuchet MS, sans-serif','#cfd8dc');}
function render(){btns=[];const sh=shake>0&&state==='play';if(sh){shake--;ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);}if(L.theme==='out')drawBgOut();else drawBgIn();drawWorld();
 if(sh)ctx.restore();
 if(state==='play'||state==='clear'||state==='over'||state==='win'||state==='cwin'||state==='cfail')drawHUD();
 if(state==='smenu')drawSMenu();else if(state==='story')drawScene();
 if(state==='cmenu')drawMenu();else if(state==='cintro')drawIntro();else if(state==='cwin')drawCWin();else if(state==='cfail')drawCFail();
 if(state==='title')drawTitle();else if(state==='clear')drawClear();else if(state==='over')drawOver();else if(state==='win')drawWin();}

blank();buildL1();resetPlayer(2*T);stateT=40;startGate();
let last=performance.now(),accum=0;
function loop(now){accum+=Math.min(100,now-last);last=now;while(accum>=1000/60){update();accum-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
